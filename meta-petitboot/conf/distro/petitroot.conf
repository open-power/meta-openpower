DISTRO = "petitroot"
DISTRO_NAME = "Petitroot (Distro customized for petitboot)"
DISTRO_VERSION = "1.0"

DISTRO_FEATURES_OPTED_OUT = "\
	3g \
	alsa \
	bluetooth \
	debuginfod \
	gobject-introspection-data \
	multiarch \
	nfc \
	opengl \
	pulseaudio \
	vulkan \
	wayland \
	x11 \
"

FULL_OPTIMIZATION = "-Os"
INIT_MANAGER ?= "sysvinit"

# Just in case someone overrides INIT_MANAGER
SYSTEMD_DEFAULT_TARGET = "multi-user.target"
