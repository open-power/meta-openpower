# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-petitboot"
BBFILE_PATTERN_meta-petitboot = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-petitboot = "6"

LAYERDEPENDS_meta-petitboot = "core openembedded-layer networking-layer"
LAYERSERIES_COMPAT_meta-petitboot = "wrynose"
