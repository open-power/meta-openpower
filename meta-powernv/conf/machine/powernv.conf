#@TYPE: Machine
#@NAME: Generic PowerNV (Non-Virtualized) machine
#@DESCRIPTION: Machine configuration for Power systems without a hypervisor

require conf/machine/include/powernv.inc
require conf/machine/include/qemuboot-powernv.inc

INITRAMFS_IMAGE ?= "petitboot-image"
INITRAMFS_MAXSIZE = "240000"
INITRAMFS_IMAGE_BUNDLE = "1"

PETITBOOT_GETTY_PORT = "hvc* tty0 ttyS*"
SERIAL_CONSOLES = ""
USE_VT = "0"

MACHINE_ESSENTIAL_EXTRA_RRECOMMENDS += "\
    kernel-modules \
    linux-firmware-bnx2x \
    linux-firmware-cxgb4 \
"

# Bundled petitboot initramfs
QB_KERNEL_ROOT = ""
QB_DEFAULT_FSTYPE = "none"
