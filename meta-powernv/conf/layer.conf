# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-powernv"
BBFILE_PATTERN_meta-powernv = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-powernv = "6"

LAYERDEPENDS_meta-powernv = "core openembedded-layer meta-petitboot"
LAYERSERIES_COMPAT_meta-powernv = "wrynose"
